name: Daily 4 AM Autonomous Video Producer & Publisher (DISABLED)

# AUTOMATION STOPPED BY USER REQUEST
# Schedule commented out - workflow will NOT run automatically
on:
  # schedule:
  #   - cron: '30 22 * * *'
  workflow_dispatch: # Manual trigger only if explicitly desired

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎥 Install FFmpeg & System Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow numpy google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 requests pynacl replicate

      - name: 🚀 Run Autonomous Production Pipeline (4 AM Daily Release)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          python "Bob Big Questions/autonomous_engine/master_runner.py"

      - name: 💾 Commit & Push Production History Log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Bob Big Questions Automation Bot"
          git add "Bob Big Questions/autonomous_engine/topic_history.json" "Bob Big Questions/autonomous_engine/published_episodes.json" || true
          git commit -m "chore(history): update daily published episodes and topic queue [skip ci]" || true
          git push || true
